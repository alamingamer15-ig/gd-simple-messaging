plugins {
    id 'com.android.library' version '8.7.3'
}

android {
    namespace 'org.simplemessaging.androidaudioaec'
    compileSdk 35

    defaultConfig {
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.godotengine:godot:4.7.0.stable'
}

tasks.register('copyDebugAar', Copy) {
    dependsOn 'assembleDebug'
    from(layout.buildDirectory.file('outputs/aar/AndroidAudioAEC-debug.aar'))
    into(layout.projectDirectory.dir('../bin/debug'))
    rename { 'AndroidAudioAEC.aar' }
}

tasks.register('copyReleaseAar', Copy) {
    dependsOn 'assembleRelease'
    from(layout.buildDirectory.file('outputs/aar/AndroidAudioAEC-release.aar'))
    into(layout.projectDirectory.dir('../bin/release'))
    rename { 'AndroidAudioAEC.aar' }
}
